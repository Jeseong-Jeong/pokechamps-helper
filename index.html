<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포챔스 M-C 도우미</title>
<meta name="description" content="포켓몬 챔피언스 레귤레이션 M-C 추천 봇(데미지 계산·팀 추천)과 도감">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{--ground:#F2F4F8;--surface:#FFFFFF;--ink:#151A25;--muted:#5A6373;--line:#DCE0E8;--accent:#2446B5;--accent-soft:#E3E9FB;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;--f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--ground:#0E121A;--surface:#161B26;--ink:#E7EAF0;--muted:#98A1B2;--line:#2A3140;--accent:#86A0FF;--accent-soft:#1F2A4D}}
:root[data-theme="dark"]{color-scheme:dark;--ground:#0E121A;--surface:#161B26;--ink:#E7EAF0;--muted:#98A1B2;--line:#2A3140;--accent:#86A0FF;--accent-soft:#1F2A4D}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);line-height:1.55;padding:0 16px 48px}
.wrap{max-width:760px;margin:0 auto;padding-top:48px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,7vw,48px);line-height:1.05;margin:0}
.sub{color:var(--muted);margin:10px 0 28px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 20px 18px}
a.card:hover{border-color:var(--accent)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card h2{margin:0 0 6px;font-size:20px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .go{display:inline-block;margin-top:14px;color:var(--accent);font-weight:600;font-size:14px}
footer{margin-top:32px;color:var(--muted);font-size:12.5px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>포챔스 M-C 도우미</h1>
  <p class="sub">Pokémon Champions 레귤레이션 M-C · 더블배틀. 봇은 추천만 하고 조작은 직접 합니다.</p>
  <div class="cards">
    <a class="card" href="advisor.html">
      <h2>추천 봇</h2>
      <p>데미지 계산, 팀 추천·스크린샷 불러오기, 팀 진단, 선출 추천. 배틀 도우미는 준비 중입니다.</p>
      <span class="go">열기 →</span>
    </a>
    <a class="card" href="pokechamps-mc.html">
      <h2>도감</h2>
      <p>참전 포켓몬 종족값·특성·기술, 사용률 순위와 채용률.</p>
      <span class="go">열기 →</span>
    </a>
  </div>
  <footer>
    데이터: <a href="https://www.serebii.net/pokemonchampions/" target="_blank" rel="noopener">Serebii</a>,
    <a href="https://www.pikalytics.com/pokedex/gen9championsvgc2026regmc/" target="_blank" rel="noopener">Pikalytics</a>,
    <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokeAPI</a> ·
    계산: <a href="https://github.com/smogon/damage-calc" target="_blank" rel="noopener">@smogon/calc</a>.
    비공식 팬 도구이며 Nintendo·The Pokémon Company와 관계없습니다.
  </footer>
</div>
</body>
</html>
